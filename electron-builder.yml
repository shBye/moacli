appId: app.moacli.desktop
productName: MoaCLI
directories:
  output: out
files:
  - dist/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**/*
extraResources:
  - from: profiles
    to: profiles
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: MoaCLI
nsis:
  artifactName: MoaCLI-Setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MoaCLI
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerLanguages: en_US
  language: "1033"
  multiLanguageInstaller: false
npmRebuild: false
